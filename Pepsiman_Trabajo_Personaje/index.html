<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pepsiman Poster</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="cartel">
        <h1 class="txt-fondo">PEPSIMAN</h1>

        <div class="pepsi-man">
            <div class="cadena"></div>

            <div class="cabeza">
                <div class="refl-cara"></div>
            </div>

            <div class="cuello"></div>

            <div class="torso">
                <div class="logo">
                    <div class="logo-rojo"></div>
                    <div class="logo-blanco"></div>
                    <div class="logo-azul"></div>
                </div>
            </div>

            <div class="mano-apunta">
                <div class="palma"></div>
                <div class="dedo d-1"></div>
                <div class="dedo d-2"></div>
                <div class="dedo d-3"></div>
                <div class="dedo-indice">
                    <div class="punta-indice"></div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
